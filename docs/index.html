<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vagas do Rio — Empregos no Rio de Janeiro</title>
<meta name="description" content="Vagas de emprego atualizadas todos os dias em todas as regiões do Rio de Janeiro. Busque por cargo e cidade.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ocean: #0B3B5C;
    --ocean-deep: #062A42;
    --sand: #F4ECDC;
    --sun: #F2A93B;
    --ink: #17222B;
    --wave-w: #FBF8F1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  h1, h2, .brand {
    font-family: 'Fraunces', serif;
  }
  header.masthead {
    background: var(--ocean);
    color: var(--wave-w);
    padding: 28px 20px 40px;
    text-align: center;
  }
  .brand {
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .tagline {
    margin: 6px 0 0;
    font-size: 0.95rem;
    color: #CFE3EF;
  }
  .wave-divider {
    display: block;
    width: 100%;
    height: 26px;
    margin-top: 26px;
  }
  .search-wrap {
    max-width: 640px;
    margin: -18px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 2;
  }
  .search-box {
    background: var(--wave-w);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(6, 42, 66, 0.18);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .search-box input {
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
    border: 1.5px solid #E3D9C4;
    border-radius: 9px;
    outline: none;
    background: #fff;
    color: var(--ink);
  }
  .search-box input:focus {
    border-color: var(--ocean);
  }
  .search-row {
    display: flex;
    gap: 10px;
  }
  .search-row input { flex: 1; min-width: 0; }
  .search-btn {
    background: var(--sun);
    color: var(--ocean-deep);
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .status-line {
    font-size: 0.85rem;
    color: #6B5F4B;
    margin: 0 0 18px;
    text-align: center;
  }
  .job-card {
    background: var(--wave-w);
    border: 1px solid #E7DCC5;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .job-title {
    font-size: 1.08rem;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--ocean-deep);
  }
  .job-meta {
    font-size: 0.87rem;
    color: #6B5F4B;
    margin: 0 0 10px;
  }
  .job-desc {
    font-size: 0.92rem;
    color: #3A3227;
    margin: 0 0 14px;
  }
  .apply-link {
    display: inline-block;
    background: var(--ocean);
    color: #fff;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #6B5F4B;
  }
  .adzuna-credit {
    text-align: center;
    font-size: 0.78rem;
    color: #8A7D65;
    margin-top: 30px;
  }
  .adzuna-credit a { color: var(--ocean); }
</style>
</head>
<body>

<header class="masthead">
  <p class="brand">Vagas do Rio</p>
  <p class="tagline">Vagas de emprego em todo o Rio de Janeiro, atualizadas todos os dias</p>
  <svg class="wave-divider" viewBox="0 0 400 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 10 Q 12.5 0 25 10 T 50 10 T 75 10 T 100 10 T 125 10 T 150 10 T 175 10 T 200 10 T 225 10 T 250 10 T 275 10 T 300 10 T 325 10 T 350 10 T 375 10 T 400 10 V20 H0 Z" fill="#FBF8F1"/>
  </svg>
</header>

<div class="search-wrap">
  <div class="search-box">
    <div class="search-row">
      <input type="text" id="q" placeholder="Cargo (ex: vendedor, motorista...)">
    </div>
    <div class="search-row">
      <input type="text" id="loc" placeholder="Cidade (ex: Guapimirim, Niterói...)">
      <button class="search-btn" onclick="filterJobs()">Buscar</button>
    </div>
  </div>
</div>

<main>
  <p class="status-line" id="status">Carregando vagas...</p>
  <div id="results"></div>
  <p class="adzuna-credit">Vagas fornecidas por <a href="https://www.adzuna.com.br" target="_blank" rel="noopener">Adzuna</a></p>
</main>

<script>
  let allJobs = [];

  function timeAgo(dateStr) {
    if (!dateStr) return "";
    const diff = (Date.now() - new Date(dateStr)) / 1000;
    const days = Math.floor(diff / 86400);
    if (days <= 0) return "hoje";
    if (days === 1) return "há 1 dia";
    return `há ${days} dias`;
  }

  function renderJobs(jobs) {
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    if (jobs.length === 0) {
      results.innerHTML = '';
      status.textContent = '';
      results.innerHTML = '<div class="empty-state">Nenhuma vaga encontrada com esses termos. Tente uma cidade ou cargo diferente.</div>';
      return;
    }
    status.textContent = `${jobs.length} vaga(s) encontrada(s)`;
    results.innerHTML = jobs.map(job => `
      <div class="job-card">
        <p class="job-title">${escapeHtml(job.title)}</p>
        <p class="job-meta">${escapeHtml(job.company)} · ${escapeHtml(job.location)} · ${timeAgo(job.created)}</p>
        <p class="job-desc">${escapeHtml(job.description)}${job.description.length >= 400 ? '…' : ''}</p>
        <a class="apply-link" href="${job.apply_url}" target="_blank" rel="noopener">Candidatar-se →</a>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function filterJobs() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const loc = document.getElementById('loc').value.trim().toLowerCase();
    const filtered = allJobs.filter(job => {
      const matchesQ = !q || job.title.toLowerCase().includes(q) || job.description.toLowerCase().includes(q);
      const matchesLoc = !loc || job.location.toLowerCase().includes(loc);
      return matchesQ && matchesLoc;
    });
    renderJobs(filtered);
  }

  document.getElementById('q').addEventListener('keyup', e => { if (e.key === 'Enter') filterJobs(); });
  document.getElementById('loc').addEventListener('keyup', e => { if (e.key === 'Enter') filterJobs(); });

  fetch('jobs.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      allJobs = data.jobs || [];
      const updated = new Date(data.updated_at).toLocaleString('pt-BR');
      document.getElementById('status').textContent = `${allJobs.length} vagas · atualizado em ${updated}`;
      renderJobs(allJobs);
    })
    .catch(() => {
      document.getElementById('status').textContent = '';
      document.getElementById('results').innerHTML = '<div class="empty-state">Não foi possível carregar as vagas agora. Tente novamente mais tarde.</div>';
    });
</script>

</body>
</html>
